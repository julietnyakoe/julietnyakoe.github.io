<title>Juliet Nyakoe — RevOps</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg:#F1F3F3;
    --surface:#FFFFFF;
    --surface-2:#E7EAEA;
    --ink:#151A1E;
    --ink-soft:#4B555C;
    --line:rgba(21,26,30,0.13);
    --line-strong:rgba(21,26,30,0.28);
    --accent:#C1571B;
    --accent-ink:#8F4013;
    --accent-soft:#F1DCC9;
    --good:#2F7A52;
    --good-soft:#DCEBE1;
    --focus:#1C6FB0;
    --shadow: 0 1px 2px rgba(21,26,30,0.06), 0 8px 24px -12px rgba(21,26,30,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12151A;
      --surface:#181D22;
      --surface-2:#20262C;
      --ink:#EAEDEF;
      --ink-soft:#9DA8AF;
      --line:rgba(234,237,239,0.14);
      --line-strong:rgba(234,237,239,0.30);
      --accent:#E38A4B;
      --accent-ink:#F3C39A;
      --accent-soft:#3A2A1E;
      --good:#5FAE84;
      --good-soft:#1C2F26;
      --focus:#5CA6E0;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12151A;
    --surface:#181D22;
    --surface-2:#20262C;
    --ink:#EAEDEF;
    --ink-soft:#9DA8AF;
    --line:rgba(234,237,239,0.14);
    --line-strong:rgba(234,237,239,0.30);
    --accent:#E38A4B;
    --accent-ink:#F3C39A;
    --accent-soft:#3A2A1E;
    --good:#5FAE84;
    --good-soft:#1C2F26;
    --focus:#5CA6E0;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  a:focus-visible, button:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--focus);
    outline-offset:2px;
  }
  h1,h2,h3,h4{
    font-family:'Fraunces', Georgia, serif;
    font-weight:600;
    text-wrap:balance;
    margin:0;
    letter-spacing:-0.01em;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', ui-monospace, monospace;
    font-size:0.72rem;
    letter-spacing:0.09em;
    text-transform:uppercase;
    color:var(--accent-ink);
    display:inline-flex;
    align-items:center;
    gap:0.5em;
  }
  .eyebrow .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--accent);
    flex:none;
  }
  .wrap{
    max-width:920px;
    margin:0 auto;
    padding-inline:24px;
  }
  .muted{color:var(--ink-soft);}

  /* ---------- header ---------- */
  .site-header{
    position:sticky;top:0;z-index:20;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:920px;margin:0 auto;padding-inline:24px;
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;height:64px;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    font-family:'Fraunces',serif;font-weight:600;font-size:1.02rem;
    white-space:nowrap;
    background:none;border:none;padding:0;cursor:pointer;color:var(--ink);
  }
  .brand svg{flex:none;}
  nav.tabs{
    display:flex;gap:4px;
    overflow-x:auto;
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.74rem;
    letter-spacing:0.04em;
    text-transform:uppercase;
    background:none;border:none;cursor:pointer;
    color:var(--ink-soft);
    padding:8px 12px;
    border-radius:999px;
    white-space:nowrap;
    transition:background 0.15s, color 0.15s;
  }
  nav.tabs button:hover{color:var(--ink);}
  nav.tabs button[aria-current="page"]{
    background:var(--surface-2);
    color:var(--ink);
  }

  main{min-height:60vh;}
  .view{padding-block:56px 96px;}
  .view.tight{padding-block:40px 96px;}

  /* ---------- hero ---------- */
  .hero{padding-block:12px 40px;}
  .hero h1{font-size:clamp(2.1rem, 5vw, 3rem); line-height:1.08;}
  .hero .role{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.92rem;
    color:var(--accent-ink);
    margin-top:10px;
    letter-spacing:0.02em;
  }
  .hero p.lede{
    max-width:56ch;
    font-size:1.1rem;
    color:var(--ink-soft);
    margin-top:18px;
  }
  .node-mark{display:block;margin-bottom:18px;}

  .cta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;}
  .btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.78rem;
    letter-spacing:0.03em;
    text-transform:uppercase;
    padding:11px 18px;
    border-radius:8px;
    border:1px solid var(--line-strong);
    background:var(--surface);
    cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;
    text-decoration:none;
    color:var(--ink);
    transition:border-color .15s, background .15s, transform .15s;
  }
  .btn:hover{border-color:var(--accent); transform:translateY(-1px);}
  .btn.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .btn.primary:hover{background:var(--accent-ink); border-color:var(--accent-ink);}

  /* ---------- proof strip ---------- */
  .proof{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    margin-top:40px;
  }
  .proof .cell{
    background:var(--surface);
    padding:22px 20px;
  }
  .proof .num{
    font-family:'IBM Plex Mono',monospace;
    font-size:1.5rem;
    font-variant-numeric:tabular-nums;
    color:var(--ink);
  }
  .proof .num b{color:var(--accent-ink);}
  .proof .cap{margin-top:8px;font-size:0.86rem;color:var(--ink-soft);}
  @media (max-width:640px){
    .proof{grid-template-columns:1fr;}
  }

  section.block{margin-top:64px;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
  .section-head h2{font-size:1.5rem;}

  /* ---------- what-i-do list ---------- */
  .do-list{display:grid;gap:14px;}
  .do-list .item{
    display:flex;gap:14px;
    padding:16px 0;
    border-top:1px solid var(--line);
  }
  .do-list .item:first-child{border-top:none;}
  .do-list .tag{
    font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:var(--ink-soft);
    flex:none;width:6.5em;padding-top:2px;
  }

  /* ---------- work cards ---------- */
  .work-grid{display:grid;gap:14px;}
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px 22px;
    display:block;
    text-decoration:none;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s, box-shadow .15s, transform .15s;
  }
  .card:hover{border-color:var(--line-strong); box-shadow:var(--shadow); transform:translateY(-2px);}
  .card .row1{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .card h3{font-size:1.12rem;margin-top:6px;}
  .card .hook{margin-top:8px;color:var(--ink-soft);font-size:0.96rem;}
  .card .go{font-family:'IBM Plex Mono',monospace;font-size:0.76rem;color:var(--accent-ink);white-space:nowrap;}
  .pill{
    font-family:'IBM Plex Mono',monospace;font-size:0.68rem;letter-spacing:0.05em;text-transform:uppercase;
    padding:3px 9px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ink-soft);
  }
  .pill.deep{border-color:var(--accent); color:var(--accent-ink);}

  .featured-strip{display:grid;gap:14px;}

  /* ---------- case study detail ---------- */
  .back{
    font-family:'IBM Plex Mono',monospace;font-size:0.78rem;
    background:none;border:none;cursor:pointer;color:var(--ink-soft);
    display:inline-flex;align-items:center;gap:6px;padding:0;margin-bottom:22px;
  }
  .back:hover{color:var(--ink);}
  .cs-head h1{font-size:clamp(1.7rem,4vw,2.3rem);}
  .cs-head .hook{margin-top:14px;font-size:1.12rem;color:var(--ink-soft);max-width:58ch;}
  .cs-meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;}
  .cs-meta .m{font-family:'IBM Plex Mono',monospace;font-size:0.74rem;color:var(--ink-soft);}
  .cs-meta .m b{color:var(--ink);}

  .cs-section{margin-top:46px;padding-top:2px;}
  .cs-section .num{
    font-family:'IBM Plex Mono',monospace;font-size:0.76rem;color:var(--accent-ink);
    display:block;margin-bottom:8px;letter-spacing:0.04em;
  }
  .cs-section h3{font-size:1.2rem;margin-bottom:14px;}
  .cs-section p{margin:0 0 12px 0;max-width:66ch;}
  .cs-section ul{margin:0 0 12px 0;padding-left:1.2em;max-width:66ch;}
  .cs-section li{margin-bottom:6px;}
  .caveat{
    font-size:0.88rem;color:var(--ink-soft);
    border-left:2px solid var(--line-strong);
    padding-left:14px;margin-top:16px;max-width:60ch;
  }
  .role-badge{
    display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:0.72rem;
    text-transform:uppercase;letter-spacing:0.04em;
    padding:4px 10px;border-radius:6px;margin-bottom:10px;
    background:var(--good-soft); color:var(--good);
  }
  .role-badge.partner{background:var(--surface-2); color:var(--ink-soft);}
  .note-tag{
    display:inline-block;margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:0.7rem;
    color:var(--ink-soft); border:1px dashed var(--line-strong); padding:4px 10px; border-radius:6px;
  }

  /* ---------- flow diagram ---------- */
  .flow{margin-top:6px;border-left:2px solid var(--line-strong);padding-left:22px;display:grid;gap:0;}
  .flow-step{position:relative;padding-bottom:22px;}
  .flow-step:last-child{padding-bottom:0;}
  .flow-step::before{
    content:"";position:absolute;left:-27.5px;top:4px;width:9px;height:9px;border-radius:50%;
    background:var(--accent); border:2px solid var(--bg);
  }
  .flow-node{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:12px 16px;
  }
  .flow-node .t{font-weight:600;font-size:0.95rem;}
  .flow-node .d{margin-top:4px;font-size:0.86rem;color:var(--ink-soft);}
  .flow-branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;}
  .flow-branch{
    background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  }
  .flow-branch .t{font-family:'IBM Plex Mono',monospace;font-size:0.78rem;color:var(--accent-ink);}
  .flow-branch .d{margin-top:6px;font-size:0.85rem;color:var(--ink-soft);}

  /* ---------- tool-frame chrome (echoes real product UI, sanitized) ---------- */
  .tool-frame{
    border:1px solid var(--line);border-radius:12px;overflow:hidden;
    background:var(--surface); margin-top:4px;
  }
  .tool-bar{
    display:flex;align-items:center;gap:10px;
    padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .tool-dots{display:flex;gap:6px;flex:none;}
  .tool-dots span{width:8px;height:8px;border-radius:50%;background:var(--line-strong);display:block;}
  .tool-name{
    font-family:'IBM Plex Mono',monospace;font-size:0.7rem;font-weight:600;letter-spacing:0.02em;
    padding:3px 9px;border-radius:5px;color:#fff;white-space:nowrap;
  }
  .tool-crumb{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tool-body{padding:20px;}
  .tool-sanitized{
    font-family:'IBM Plex Mono',monospace;font-size:0.64rem;color:var(--ink-soft);
    margin-left:auto;white-space:nowrap;
  }

  /* ---------- dashboard tiles (illustrative, sanitized) ---------- */
  .dash-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px;}
  .dash-tile{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
  .dash-tile .k{font-family:'IBM Plex Mono',monospace;font-size:0.64rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.04em;}
  .dash-tile .v{font-family:'IBM Plex Mono',monospace;font-size:1.15rem;margin-top:5px;font-variant-numeric:tabular-nums;}
  .dash-tile .bar{margin-top:9px;height:6px;border-radius:3px;background:var(--bg);overflow:hidden;}
  .dash-tile .bar > i{display:block;height:100%;background:var(--accent);}

  /* ---------- about timeline ---------- */
  .timeline{border-left:2px solid var(--line-strong);padding-left:22px;display:grid;gap:26px;margin-top:8px;}
  .t-item{position:relative;}
  .t-item::before{
    content:"";position:absolute;left:-27.5px;top:4px;width:9px;height:9px;border-radius:50%;
    background:var(--ink-soft);border:2px solid var(--bg);
  }
  .t-item.current::before{background:var(--accent);}
  .t-item .when{font-family:'IBM Plex Mono',monospace;font-size:0.76rem;color:var(--ink-soft);}
  .t-item .what{margin-top:4px;font-weight:600;}
  .t-item .where{margin-top:2px;font-size:0.9rem;color:var(--ink-soft);}

  /* ---------- skills ---------- */
  .skill-groups{display:grid;gap:22px;}
  .skill-group .label{font-family:'IBM Plex Mono',monospace;font-size:0.74rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.05em;}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .chip{
    background:var(--surface);border:1px solid var(--line);border-radius:8px;
    padding:8px 12px;font-size:0.9rem;
  }
  .cap-pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .cap-pill{
    font-family:'IBM Plex Mono',monospace;font-size:0.72rem;
    background:var(--accent-soft); color:var(--accent-ink);
    padding:6px 11px;border-radius:999px;
  }

  /* ---------- certifications ---------- */
  .cert-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));}
  .cert-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;}
  .cert-card .t{font-weight:600;}
  .cert-card .s{margin-top:4px;font-size:0.86rem;color:var(--ink-soft);}

  /* ---------- contact ---------- */
  .contact-box{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:34px 30px;margin-top:20px;
  }
  .contact-box p{max-width:52ch;color:var(--ink-soft);}
  .copy-hint{font-family:'IBM Plex Mono',monospace;font-size:0.76rem;color:var(--good);margin-top:10px;min-height:1.2em;}

  /* ---------- HubSpot-style workflow canvas mock ---------- */
  .hs-canvas{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);}
  .hs-topbar{background:#1C1F26;color:#fff;padding:12px 18px;text-align:center;}
  .hs-topbar .title{font-family:'IBM Plex Sans',sans-serif;font-size:0.86rem;font-weight:500;}
  .hs-topbar .sub{font-family:'IBM Plex Mono',monospace;font-size:0.66rem;color:#9AA3AF;margin-top:3px;}
  .hs-canvas-body{background:var(--bg);padding:28px 18px;display:flex;flex-direction:column;align-items:center;}
  .hs-node{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:12px 16px;min-width:220px;max-width:340px;text-align:left;box-shadow:var(--shadow);}
  .hs-node .icon-row{display:flex;align-items:center;gap:8px;}
  .hs-node .icon{width:22px;height:22px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:0.7rem;flex:none;}
  .hs-node .label{font-size:0.86rem;font-weight:600;}
  .hs-node .desc{margin-top:6px;font-size:0.82rem;color:var(--ink-soft);}
  .hs-connector{width:2px;height:26px;background:var(--line-strong);}
  .hs-plus{width:18px;height:18px;border-radius:50%;border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:var(--ink-soft);background:var(--surface);margin:2px 0;}
  .hs-branches{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:0;}
  .hs-branch-col{display:flex;flex-direction:column;align-items:center;}
  .hs-outcome{background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:8px 16px;font-size:0.82rem;font-weight:600;text-align:center;}
  .hs-outcome-detail{margin-top:8px;font-size:0.78rem;color:var(--ink-soft);text-align:center;max-width:190px;}

  /* ---------- Calendly-style routing list mock ---------- */
  .cal-mock{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:22px 22px 8px;}
  .cal-mock .crumb-link{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:var(--focus);}
  .cal-mock h4{font-family:'IBM Plex Sans',sans-serif;font-size:1.05rem;font-weight:600;margin-top:10px;}
  .cal-mock .edited{font-size:0.78rem;color:var(--ink-soft);margin-top:3px;}
  .cal-tabs{display:flex;gap:18px;margin-top:16px;border-bottom:1px solid var(--line);}
  .cal-tabs span{font-size:0.84rem;padding-bottom:9px;color:var(--ink-soft);}
  .cal-tabs span.active{color:var(--ink);border-bottom:2px solid var(--accent);font-weight:600;}
  .cal-routes-head{display:flex;justify-content:space-between;align-items:center;margin-top:18px;}
  .cal-route{display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--line);}
  .cal-route:first-of-type{border-top:none;}
  .cal-route .n{font-family:'IBM Plex Mono',monospace;font-size:0.78rem;color:var(--ink-soft);flex:none;width:1.3em;padding-top:2px;}
  .cal-route .body{flex:1;}
  .cal-route .rule{font-size:0.86rem;color:var(--ink-soft);}
  .cal-route .rule b{color:var(--ink);font-weight:600;}
  .cal-dest{margin-top:10px;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 8px 8px 0;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .cal-dest .dt{font-weight:600;font-size:0.92rem;}
  .cal-dest .dm{font-size:0.78rem;color:var(--ink-soft);margin-top:2px;}
  .cal-avatars{display:flex;}
  .cal-avatars span{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.62rem;font-weight:600;color:#fff;margin-left:-6px;border:2px solid var(--surface-2);}

  /* ---------- Salesforce-style dashboard mock ---------- */
  .sf-dash{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);}
  .sf-head{padding:12px 18px;border-bottom:1px solid var(--line);}
  .sf-head .t{font-weight:600;font-size:0.92rem;}
  .sf-head .s{font-size:0.76rem;color:var(--ink-soft);margin-top:3px;max-width:60ch;}
  .sf-head .meta{font-family:'IBM Plex Mono',monospace;font-size:0.66rem;color:var(--ink-soft);margin-top:6px;}
  .sf-band{background:#37326E;color:#fff;font-size:0.74rem;font-weight:600;letter-spacing:0.02em;padding:7px 18px;}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sf-band{background:#4A4390;}}
  :root[data-theme="dark"] .sf-band{background:#4A4390;}
  .sf-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);}
  .sf-tile{background:var(--surface);padding:12px 14px;}
  .sf-tile .k{font-size:0.68rem;color:var(--ink-soft);}
  .sf-tile .v{font-family:'IBM Plex Mono',monospace;font-size:1.2rem;color:var(--good);margin-top:4px;font-variant-numeric:tabular-nums;}
  .sf-charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);}
  .sf-chart{background:var(--surface);padding:12px 14px;}
  .sf-chart .k{font-size:0.68rem;color:var(--ink-soft);margin-bottom:8px;}
  .sf-bars{display:flex;align-items:flex-end;gap:5px;height:60px;}
  .sf-bars i{display:block;flex:1;background:#6C7FE0;border-radius:2px 2px 0 0;}

/* ============ RENDER HELPERS ============ */

function el(html){
  const d = document.createElement('div');
  d.innerHTML = html.trim();
  return d.firstElementChild;
}

function flowHTML(steps){
  return `<div class="flow">${steps.map(s=>{
    if(s.type==="node"){
      return `<div class="flow-step"><div class="flow-node"><div class="t">${s.t}</div>${s.d?`<div class="d">${s.d}</div>`:""}</div></div>`;
    } else {
      return `<div class="flow-step"><div class="flow-branches">${s.items.map(b=>`<div class="flow-branch"><div class="t">${b.t}</div>${b.d?`<div class="d">${b.d}</div>`:""}</div>`).join("")}</div></div>`;
    }
  }).join("")}</div>`;
}

function dashTilesHTML(tiles){
  return `<div class="dash-tiles">${tiles.map(t=>`
    <div class="dash-tile">
      <div class="k">${t.k}</div>
      <div class="v">${t.v}</div>
      <div class="bar"><i style="width:${t.pct}%"></i></div>
    </div>`).join("")}</div>`;
}

          <div class="hs-outcome-detail">${o.d}</div>

}

function howItWorkedHTML(p){
  if(p.stageFlow){
    const flows = p.stageFlow.map(f=>`<div class="sf-multi-label">${f.label}</div>${flowHTML(f.steps)}`).join("");
    const last = p.stageFlow[p.stageFlow.length-1].label;
    const mock = p.uiMock ? `<div class="sf-multi-label">${last} — workflow view</div>${hsCanvasHTML(p.uiMock)}` : "";
    return flows + mock;
  }
  if(p.uiMock){
    const m = p.uiMock;
    if(m.type==="hubspot") return hsCanvasHTML(m);
    if(m.type==="calendly") return calRoutesHTML(m);
    if(m.type==="salesforce") return sfDashboardHTML(m);
    if(m.type==="hs-env") return hsEnvHTML(m);
    if(m.type==="amp-sequence") return ampSequenceHTML(m);
    if(m.type==="salesforce-multi"){
      return m.dashboards.map(d=>`<div class="sf-multi-label">${d.label}</div>${sfDashboardHTML(d)}`).join("");
    }
  }
  return toolFrameHTML(p, (p.dashTiles?dashTilesHTML(p.dashTiles):"") + flowHTML(p.flow));
}

/* ============ ROUTER ============ */

function parseHash(){
  const h = (location.hash || "#home").slice(1);
  const parts = h.split("/").filter(Boolean);
  return {route: parts[0] || "home", sub: parts[1] || null};
}

function render(){
  const {route, sub} = parseHash();
  const root = document.getElementById('view-root');
  let html = "";
  let topRoute = route;
  if(route==="home") html = viewHome();
  else if(route==="work" && !sub) html = viewWork();
  else if(route==="work" && sub){ html = viewCaseStudy(sub); topRoute="work"; }
  else if(route==="about") html = viewAbout();
  else if(route==="skills") html = viewSkills();
  else if(route==="certifications") html = viewCertifications();
  else if(route==="contact") html = viewContact();
  else html = viewHome();

  root.innerHTML = html;
  window.scrollTo({top:0, behavior:"instant"});

  document.querySelectorAll('#tabs button').forEach(btn=>{
    if(btn.dataset.route === topRoute) btn.setAttribute('aria-current','page');
    else btn.removeAttribute('aria-current');
  });
}

function go(route){ location.hash = "#" + route; }

function copyText(text, kind){
  try{
    navigator.clipboard.writeText(text).then(()=>{
      const hint = document.getElementById('copy-hint');
      if(hint) hint.textContent = (kind==='email' ? 'Email' : 'Phone number') + ' copied to clipboard — ' + text;
    }).catch(()=>{});
  }catch(e){}
}

document.getElementById('tabs').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-route]');
  if(btn) go(btn.dataset.route);
});

window.addEventListener('hashchange', render);
render();
</script>
